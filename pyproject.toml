[build-system]
requires = ["setuptools>=68", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "mstracker"
version = "0.1.0"
description = "Offline instrument maintenance history"
requires-python = ">=3.11"
dependencies = ["Flask==3.1.3", "Werkzeug==3.1.8", "waitress==3.0.2", "tzdata==2026.4"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
build = ["pyinstaller==6.22.0"]

[project.scripts]
mstracker = "mstracker.cli:main"

[tool.setuptools.packages.find]
include = ["mstracker*"]

[tool.setuptools.package-data]
mstracker = ["migrations/*.sql", "templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
